version: 2

sources:
  - name: raw_data
    schema: raw_data
    tables:
      - name: raw_llm_traces
        description: "Raw LLM JSON logs appended by the agent system."

models:
  - name: stg_llm_traces
    description: "Cleaned up view of the raw LLM traces."
    columns:
      - name: trace_id
        description: "Identifier for the execution trace. Note: NOT unique here because multi-step agents produce multiple rows per trace."
        tests:
          - not_null
      - name: customer_id
        description: "Client identifier."
        tests:
          - not_null
      - name: model_name
        description: "The specific LLM endpoint used for this API call."
        tests:
          - not_null
          - accepted_values:
              values: ['gpt-4o', 'claude-3-5-sonnet', 'gpt-4o-mini']
      - name: estimated_cost_usd
        description: "The cost initially generated by the synthetic script."
        tests:
          - not_null

  - name: stg_model_pricing
    description: "Static seed mapping LLM names to unit costs."
    columns:
      - name: model_name
        description: "LLM endpoint name."
        tests:
          - unique
          - not_null
      - name: cost_per_1m_input_tokens
        tests:
          - not_null
      - name: cost_per_1m_output_tokens
        tests:
          - not_null
