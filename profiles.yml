onvlo:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'postgres') }}"
      pass: "{{ env_var('DB_PASSWORD', '') }}"
      port: 5432
      dbname: "{{ env_var('DB_NAME', 'onvlo') }}"
      schema: public
      threads: 4
